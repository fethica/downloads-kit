name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :downloads:testDebugUnitTest :downloads-compose:testDebugUnitTest :sample:testDebugUnitTest :downloads:lintDebug :downloads-compose:lintDebug :sample:lintDebug :downloads:assembleRelease :downloads-compose:assembleRelease :downloads:publishToMavenLocal :downloads-compose:publishToMavenLocal :sample:assembleDebug --no-daemon
